name: Build and test

# The product solution plus the test projects that do not need a display. GtkWinFormsApp.UITests is
# deliberately excluded: it drives the real sample forms and needs a desktop session, so it stays a
# local/self-hosted gate until headless capture is in scope (see GtkWinFormsApp.UITests/README.md).
#
# Runs on Windows, Linux and macOS. The Net4x.GtkSharp binding is managed-only and ships no native GTK:
#   - Windows: its build/GtkSharp.targets auto-downloads a GTK 4 bundle (the "Ignore Gtk extract errors"
#     lines in the build log), so nothing extra is needed here.
#   - Linux/macOS: that target is gated to Windows, so native GTK 4 is installed below (apt / Homebrew).
# The tests call Application.Init() and create real widgets, so they need native GTK at runtime and a
# display. Linux runners are headless, so the Linux test run is wrapped in xvfb-run with the X11 backend.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  product:
    name: Product solution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish so one platform's failure does not mask another's.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        # bash is available on all three runners, so the test loop below stays single-sourced.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The library is generated from the gtksystem-windows-forms submodule and mono supplies
          # reference implementations; both are needed for a faithful build.
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install GTK 4 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libgtk-4-1 pulls in cairo, pango, gdk-pixbuf, glib and gio; xvfb gives the headless runner
          # an X server for Application.Init().
          sudo apt-get install -y --no-install-recommends libgtk-4-1 xvfb

      - name: Install GTK 4 (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk4

      - name: Restore
        run: dotnet restore Gtk.Windows.Forms.sln

      - name: Build
        run: dotnet build Gtk.Windows.Forms.sln --configuration Debug --no-restore

      - name: Test
        run: |
          # No 'set -u': macOS runners use bash 3.2, where expanding the empty prefix[] array under -u aborts.
          set -eo pipefail
          projects=(
            Gtk.Drawing.Tests/Gtk.Drawing.Tests.csproj
            Gtk.Windows.Forms.Tests/Gtk.Windows.Forms.Tests.csproj
            Gtk.Windows.FormsDesigner.Tests/Gtk.Windows.FormsDesigner.Tests.csproj
            ResxProcessor.Tests/ResxProcessor.Tests.csproj
            AutoClosingMessageBox.Tests/AutoClosingMessageBox.Tests.csproj
          )
          # Per-OS native-GTK wiring for the test run (not the build):
          #   Linux  - run under a virtual X server; GTK 4 on the runner has no Wayland, so force X11.
          #   macOS  - Homebrew puts the GTK dylibs outside the default loader path.
          prefix=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            export GDK_BACKEND=x11
            prefix=(xvfb-run -a)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
          fi
          for p in "${projects[@]}"; do
            name="$(basename "$p" .csproj)"
            "${prefix[@]}" dotnet test "$p" --configuration Debug --no-build --logger "trx;LogFileName=$name.trx"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
