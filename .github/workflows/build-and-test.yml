name: Build and test

# The product solution plus the test projects that do not need a display. GtkWinFormsApp.UITests is
# deliberately excluded: it drives the real sample forms and needs a desktop session, so it stays a
# local/self-hosted gate until headless capture is in scope (see GtkWinFormsApp.UITests/README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  product:
    name: Product solution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The library is generated from the gtksystem-windows-forms submodule and mono supplies
          # reference implementations; both are needed for a faithful build.
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Gtk.Windows.Forms.sln

      - name: Build
        run: dotnet build Gtk.Windows.Forms.sln --configuration Debug --no-restore

      - name: Test
        run: |
          dotnet test Gtk.Drawing.Tests/Gtk.Drawing.Tests.csproj --configuration Debug --no-build --logger "trx;LogFileName=drawing.trx"
          dotnet test Gtk.Windows.Forms.Tests/Gtk.Windows.Forms.Tests.csproj --configuration Debug --no-build --logger "trx;LogFileName=forms.trx"
          dotnet test Gtk.Windows.FormsDesigner.Tests/Gtk.Windows.FormsDesigner.Tests.csproj --configuration Debug --no-build --logger "trx;LogFileName=designer.trx"
          dotnet test ResxProcessor.Tests/ResxProcessor.Tests.csproj --configuration Debug --no-build --logger "trx;LogFileName=resx.trx"
          dotnet test AutoClosingMessageBox.Tests/AutoClosingMessageBox.Tests.csproj --configuration Debug --no-build --logger "trx;LogFileName=messagebox.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-product
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
